apiVersion: v1
kind: Service
metadata:
  name: {{ include "tcp-bridge.fullname" . }}-headless
  labels:
    {{- include "tcp-bridge.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: TCP
    name: metrics
  selector:
    {{- include "tcp-bridge.selectorLabels" . | nindent 4 }}
