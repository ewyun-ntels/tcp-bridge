{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tcp-bridge-alerts
  {{- if .Values.serviceMonitor.namespace }}
  namespace: {{ .Values.serviceMonitor.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "tcp-bridge.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: tcp-bridge.connectivity
      rules:
        - alert: TcpBridgeMetricsUnavailable
          expr: absent(tcp_bridge_connection_state)
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: tcp-bridge
            resource: tcp-bridge
            exported_instance: tcp-bridge:metrics
          annotations:
            errCode: "2001"
            summary: tcp-bridge metrics 수집 불가
            description: 최근 1분 동안 Prometheus에서 `tcp_bridge_connection_state` 메트릭이 전혀 수집되지 않음. `absent()` 기반 알림이라 connection/pod 라벨은 제공할 수 없으며, tcp-bridge 전체 scrape 이상으로 해석해야 함. Pod 상태, ServiceMonitor, service port, scrape label 설정 확인 필요.

        - alert: TcpBridgeConnectionNotReady
          expr: tcp_bridge:ready_connection_state:max < 2
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "{sys_id}"
            exported_instance: "{sys_id}:{connection_id}"
          annotations:
            errCode: "2002"
            summary: connection READY 상태 아님
            description: 지난 2분 동안 `{{ "{{ $labels.sys_id }}" }}`의 `{{ "{{ $labels.connection_id }}" }}` connection이 READY 상태가 아님. bridge 연결 상태와 failover 동작 확인 필요.

    - name: tcp-bridge.inbound
      rules:
        - alert: TcpBridgeInboundErrorRatioHigh
          expr: |
            (
              (tcp_bridge:inbound_error_ratio:2m >= 0.10)
              and
              (tcp_bridge:inbound_responses_total:increase2m >= 5)
            )
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "{sys_id}"
            exported_instance: "{sys_id}:{connection_id}"
          annotations:
            errCode: "3001"
            summary: inbound error ratio 심각
            description: 최근 2분 동안 `{{ "{{ $labels.sys_id }}" }}`의 `{{ "{{ $labels.connection_id }}" }}` connection에서 완료된 inbound 요청 5건 이상 조건으로 error ratio 10% 이상이 1분 이상 유지됨.

    - name: tcp-bridge.outbound
      rules:
        - alert: TcpBridgeOutboundErrorRatioHigh
          expr: |
            (
              (tcp_bridge:outbound_error_ratio:2m >= 0.10)
              and
              (tcp_bridge:outbound_responses_total:increase2m >= 5)
            )
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "{sys_id}"
            exported_instance: "{sys_id}:{connection_id}"
          annotations:
            errCode: "4001"
            summary: outbound error ratio 심각
            description: 최근 2분 동안 `{{ "{{ $labels.sys_id }}" }}`의 `{{ "{{ $labels.connection_id }}" }}` connection에서 완료된 outbound 요청 5건 이상 조건으로 error ratio 10% 이상이 1분 이상 유지됨.
{{- end }}
