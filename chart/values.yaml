# Default values for tcp-bridge
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

# Instances configuration for multiple deployments
instances:
  - index: 0
    ip: "192.168.15.20"
  - index: 1
    ip: "192.168.15.21"

image:
  repository: 192.168.61.145/ewy/tcp-bridge
  pullPolicy: Always
  tag: "latest"

podAnnotations: {}

multus:
  enabled: true
  createNAD: true
  podAnnotations: {}
  network:
    name: "tcp-bridge-net"
    namespace: ""        # 빈값이면, Helm 설치 시 지정한 네임스페이스
    cniVersion: "0.3.1"
    type: "macvlan"
    master: "enp1s0"
    mode: "bridge"
    mtu: 0
    ipam:
      type: "static"
      gateway: "192.168.15.1"
      routes:
        - dst: "10.10.90.0/24"
          gw: "192.168.15.1"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  port: 8080

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 10s
  scrapeTimeout: 5s
  namespace: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - tcp-bridge
        topologyKey: kubernetes.io/hostname

config:
  server:
    name: "tcp-bridge"
    version: "1.0.0"
    environment: "development"
    shutdown_timeout: "3s"

  tcp:
    endpoints:
      - host: "192.168.15.201"
        port: 7000
        priority: 0
      - host: "192.168.15.201"
        port: 8000
        priority: 1
      - host: "192.168.15.201"
        port: 9000
        priority: 2
    
    connect_timeout: "2s"
    write_timeout: "30s"
    keep_alive: "30s"
    max_frame_size: 65535
    frame_header_size: 8
    handshake_timeout: "10s"
    ping_timeout: "5s"
    ping_interval_margin: "0s"

    sys_prefix_id: "tcp-bridge"
    branch_name: "SS"

  nats:
    urls:
      - "nats://nats.upm-messaging.svc.cluster.local:4222"
    connect_timeout: "5s"

    message_type_routing:
      outbound:
        "05":
          subject: "tcp.subs.change"
          response_msg_type: "06"
        "09":
          subject: "tcp.cellinfo.noti"
          response_msg_type: "0a"
      inbound:
        "07":
          subject: "tcp.subs.info"
          response_msg_type: "08"
        "0b":
          subject: "tcp.subs.sync"
          response_msg_type: "0c"

  message_handler:
    outbound:
      response_timeout: "5s"
      retry_attempts: 10
      worker_count: 20
      queue_size: 500
    inbound:
      timeout: "30s"
      worker_count: 20
      queue_size: 500

  metrics:
    enabled: true
    port: 8080
    path: "/metrics"
    include_default_metrics: false

  logging:
    level: "debug"
    format: "json"

  alerta:
    enabled: true
    url: "http://upm-alarm-alerta.upm-alarm.svc.cluster.local:8080/api/alert"
    timeout: "3s"
    environment: "Development"
    alerts:
      - event: "PGConnectionState"
        group: "Connection"
        err_code: "1004"

livenessProbe:
  httpGet:
    path: /metrics
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /metrics
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3
